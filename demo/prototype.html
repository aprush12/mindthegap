<style>
/* Layout: app shell with a top bar and one narrow content column (720px). One decision per screen; detail opens in a side sheet. */
:root{
  --bg:#ffffff; --subtle:#f7f8fa; --line:#e7e9ee; --ink:#14181f; --ink-2:#4b5563; --ink-3:#8a93a0;
  --accent:#2451b7; --accent-soft:#eef2fb;
  --red:#c2381f; --amber:#a8650a; --plum:#6b4aa0; --green:#2f7d4f;
  --scrim:rgba(20,24,31,.28); --shadow:0 12px 40px rgba(20,24,31,.14);
  --f-sans:"Inter",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --subtle:#171b21; --line:#262b33; --ink:#e8ebef; --ink-2:#aab2bd; --ink-3:#7c8592;
  --accent:#8fb0f0; --accent-soft:#1b2436;
  --red:#ef8a74; --amber:#e1a650; --plum:#b9a1e6; --green:#74c995;
  --scrim:rgba(0,0,0,.5); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --subtle:#171b21; --line:#262b33; --ink:#e8ebef; --ink-2:#aab2bd; --ink-3:#7c8592;
  --accent:#8fb0f0; --accent-soft:#1b2436;
  --red:#ef8a74; --amber:#e1a650; --plum:#b9a1e6; --green:#74c995;
  --scrim:rgba(0,0,0,.5); --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
h2{font-size:13px;font-weight:500;color:var(--ink-3)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar-in,.main{max-width:760px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.bar-in{height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;background:none;border:0;padding:0;cursor:pointer}
.brand svg{width:20px;height:20px}
.asof{font-size:13px;color:var(--ink-3)}

.main{padding-block:48px 120px}
.screen{display:grid;gap:40px}
.head{display:grid;gap:10px}
.crumb{background:none;border:0;padding:0;color:var(--ink-3);font-size:14px;cursor:pointer;justify-self:start}
.crumb:hover{color:var(--ink)}
.sub{color:var(--ink-2);font-size:16px;max-width:56ch}

/* list rows */
.list{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:20px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:hover{background:var(--subtle)}
.row .t{font-weight:500}
.row .d{color:var(--ink-2);font-size:14px;margin-top:2px}
.row .r{display:flex;align-items:center;gap:14px;color:var(--ink-3);font-size:14px;white-space:nowrap}
.chev{width:16px;height:16px;flex:none}

.status{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-accept{color:var(--green)} .s-conditional_accept{color:var(--green)}
.s-blocked{color:var(--amber)} .s-decline{color:var(--ink-3)}

.callout{background:var(--accent-soft);border-radius:10px;padding:20px 22px;display:grid;gap:6px}
.callout .k{font-size:13px;color:var(--accent);font-weight:500}
.callout p{font-size:17px}

.note{display:grid;gap:12px}
.note ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.note li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:12px;align-items:baseline;color:var(--ink-2)}
.note li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);transform:translateY(-2px)}

.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--bg)}
.btn:hover{background:var(--subtle)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.actions{display:flex;flex-wrap:wrap;gap:10px}

/* facility screen */
.group{display:grid;gap:4px}
.group h2{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.group h2 i{width:8px;height:8px;border-radius:50%;display:block}
.g-tonight i{background:var(--red)} .g-block i{background:var(--amber)} .g-capability i{background:var(--plum)} .g-clock i{background:var(--accent)}
.group .row{padding:16px 4px}
.due{font-variant-numeric:tabular-nums}
.done .t{color:var(--ink-3);text-decoration:line-through}
.meter{display:grid;gap:8px}
.meter-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.meter-bar span{display:block;height:100%}
.meter p{font-size:14px;color:var(--ink-2)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
.sheet-head span{font-size:13px;color:var(--ink-3)}
.x{background:none;border:0;padding:6px;cursor:pointer;color:var(--ink-2);border-radius:6px}
.x:hover{background:var(--subtle)}
.sheet-body{padding:28px 24px;overflow-y:auto;display:grid;gap:28px;align-content:start}
.sheet-body h3{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.field{display:grid;gap:8px}
.field .k{font-size:13px;color:var(--ink-3)}
.quote{border-left:2px solid var(--line);padding:2px 0 2px 14px;display:grid;gap:4px}
.quote q{font-size:15px}
.quote small{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.missing{color:var(--amber)}
.ask{font-size:16px;background:var(--subtle);border-radius:8px;padding:14px 16px}
.sheet-foot{margin-top:auto;padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}

/* call sheet */
.q{display:grid;grid-template-columns:22px minmax(0,1fr);gap:14px;padding:18px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.q input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
.q .t{font-size:15px}
.q .d{font-size:13px;color:var(--ink-3);margin-top:3px}
.q.checked .t{color:var(--ink-3);text-decoration:line-through}
.progress{font-size:14px;color:var(--ink-2)}

/* guide */
.guide{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;width:min(560px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);border-radius:12px;padding:14px 16px 14px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow)}
.guide p{font-size:14px;flex:1;min-width:0}
.guide .step{font-size:12px;opacity:.6;display:block;margin-bottom:2px}
.guide button{background:var(--bg);color:var(--ink);border:0;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.guide .skip{background:none;color:var(--bg);opacity:.6;padding:8px 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:30;background:var(--ink);color:var(--bg);font-size:14px;padding:8px 14px;border-radius:8px}

@media (min-width:1000px){body.sheet-open .guide{left:calc((100% - 460px) / 2)}}
@media (max-width:999px){body.sheet-open.guide-on .sheet{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}}
@media (max-width:600px){
  .main{padding-block:32px 140px}
  h1{font-size:24px}
  .row .r .hide-sm{display:none}
  .asof{display:none}
  .guide{flex-wrap:wrap;gap:10px}
  .guide p{flex-basis:100%}
  .guide .skip{margin-left:auto}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:in .2s ease-out}
  @keyframes in{from{transform:translateX(24px);opacity:.4}}
}
</style>

function inbox(){
  const rows = ["elena","harold"].map(c=>{
    const b = best(c), arr = wall(DATA[c].timing.arrivalAt);
    return `<button class="row" data-go="case" data-c="${c}">
      <div><div class="t">${CASES[c].name}</div><div class="d">${CASES[c].reason}</div></div>
      <div class="r"><span class="hide-sm">Arrives ${clock(arr)}</span>${chev}</div>
    </button>`;
  }).join("");
  return `<div class="screen">
    <div class="head"><h1>Referrals</h1><p class="sub">Each packet has been screened against your three facilities. Open one to see where the patient can go and what's missing.</p></div>
    <div class="list">${rows}</div>
  </div>`;
}

function caseScreen(){
  const c = state.c, d = DATA[c], b = best(c), bf = d.fac[b];
  const rows = ["A","B","C"].sort((x,y)=>RANK[d.fac[x].verdict]-RANK[d.fac[y].verdict]).map(f=>{
    const x = d.fac[f];
    return `<button class="row" data-go="fac" data-f="${f}">
      <div><div class="t">${FAC[f].name}</div><div style="margin-top:4px"><span class="status s-${x.verdict}">${VERDICT[x.verdict]}</span></div></div>
      <div class="r">${chev}</div>
    </button>`;
  }).join("");
  const gaps = d.gaps?.length ? `<div class="note"><h2>Missing from the packet, whichever facility you choose</h2><ul>${d.gaps.map(g=>`<li>${esc(g.text)}</li>`).join("")}</ul></div>` : "";
  const reco = bf.verdict==="decline"
    ? `None of your facilities can take ${CASES[c].name.split(" ")[0]} tonight.`
    : `${FAC[b].short} is the best fit. ${bf.verdict==="blocked"?"It can admit once the paperwork arrives.":"It can admit tonight with conditions."}`;
  return `<div class="screen">
    <div class="head">
      <button class="crumb" data-go="inbox">← Referrals</button>
      <h1>${CASES[c].name}</h1>
      <p class="sub">${CASES[c].reason} · ${CASES[c].age}</p>
    </div>
    <div class="callout"><span class="k">Recommendation</span><p>${reco}</p></div>
    <div class="group"><h2>Facilities</h2><div class="list">${rows}</div></div>
    ${gaps}
    <div class="actions"><button class="btn primary" data-go="calls">Open call sheet</button></div>
  </div>`;
}

function facScreen(){
  const c=state.c, f=state.f, d=DATA[c], x=d.fac[f];
  const total = Object.values(x.states).reduce((a,b)=>a+b,0);
  const met = x.states.met||0, unk = x.states.unknown||0, nm = x.states.not_met||0;
  const groups = GROUPS.map(([sev,label])=>{
    const items = x.priorities.map((p,i)=>({p,i})).filter(({p})=>p.sev===sev);
    if(!items.length) return "";
    return `<div class="group g-${sev}"><h2><i></i>${label}</h2><div class="list">${items.map(({p,i})=>{
      const done = state.resolved.has(keyOf(c,f,i));
      return `<button class="row${done?" done":""}" data-open="${i}">
        <div><div class="t">${esc(p.text)}</div>${p.due?`<div class="d due">By ${when(p.due,d.timing.arrivalAt)}</div>`:""}</div>
        <div class="r">${done?"Resolved":""}${chev}</div>
      </button>`;}).join("")}</div></div>`;
  }).join("");
  return `<div class="screen">
    <div class="head">
      <button class="crumb" data-go="case">← ${CASES[c].name}</button>
      <h1>${FAC[f].name}</h1>
      <span class="status s-${x.verdict}">${VERDICT[x.verdict]}</span>
    </div>
    <div class="meter">
      <div class="meter-bar" aria-hidden="true">
        <span style="width:${met/total*100}%;background:var(--green)"></span>
        <span style="width:${nm/total*100}%;background:var(--red)"></span>
        <span style="width:${unk/total*100}%;background:var(--amber)"></span>
      </div>
      <p>${met} of ${total} admission rules met. ${nm} not met, ${unk} not answered anywhere in the packet.</p>
    </div>
    ${groups}
  </div>`;
}

function callsScreen(){
  const c=state.c, d=DATA[c];
  const map=new Map(), order={tonight:0,block:1,capability:2,clock:3,gap:4};
  for(const f of ["A","B","C"]) d.fac[f].priorities.forEach(p=>{
    if(!p.ask) return;
    if(!map.has(p.ask)) map.set(p.ask,{ask:p.ask,sev:isDose(p)?"tonight":p.sev,dose:isDose(p),facs:new Set()});
    const e=map.get(p.ask); e.facs.add(f); if(order[p.sev]<order[e.sev]) e.sev=p.sev;
  });
  (d.gaps||[]).forEach(g=>map.set(g.followUpAsk,{ask:g.followUpAsk,sev:"gap",facs:new Set(["A","B","C"])}));
  const qs=[...map.values()].sort((a,b)=>(b.dose-a.dose)||order[a.sev]-order[b.sev]);
  const n=qs.filter(q=>state.asked.has(c+q.ask)).length;
  return `<div class="screen">
    <div class="head">
      <button class="crumb" data-go="case">← ${CASES[c].name}</button>
      <h1>Call sheet</h1>
      <p class="sub">Everything to ask the discharging hospital, across all three facilities, most urgent first. One call instead of three.</p>
    </div>
    <div>
      <p class="progress" id="prog">${n} of ${qs.length} answered</p>
      <div class="list" style="margin-top:12px">${qs.map((q,i)=>{
        const on=state.asked.has(c+q.ask);
        const who=q.facs.size===3?"All facilities":[...q.facs].map(f=>FAC[f].short).join(", ");
        return `<label class="q${on?" checked":""}"><input type="checkbox" id="q-${c}-${i}" data-ask="${esc(q.ask)}"${on?" checked":""}>
          <div><div class="t">${esc(q.ask)}</div><div class="d">${q.dose?"Dose conflict · ":q.sev==="gap"?"Missing from packet · ":""}${who}</div></div></label>`;
      }).join("")}</div>
    </div>
    <div class="actions"><button class="btn" id="copy">Copy questions</button></div>
  </div>`;
}

/* ---------- detail sheet ---------- */
function openSheet(i){
  const c=state.c, f=state.f, d=DATA[c], p=d.fac[f].priorities[i], k=keyOf(c,f,i);
  const done=state.resolved.has(k);
  const ev = p.ev.length
    ? p.ev.map((e,j)=>`<div class="quote"><q>${esc(e.q)}</q><small>${isDose(p)?(j===0?"Discharge medication list":"Progress note")+", ":""}page ${e.p}</small></div>`).join("")
    : p.state==="unknown"
      ? `<p class="missing">Not found anywhere in the packet. Missing information is never treated as met.</p>`
      : `<p>Worked out from the medication list, this facility's formulary and its pharmacy delivery schedule.</p>`;
  layer.innerHTML = `<div class="scrim" data-close></div>
    <aside class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
      <div class="sheet-head"><span>${FAC[f].short} · ${esc(p.ids.join(", "))}</span><button class="x" data-close aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></div>
      <div class="sheet-body">
        <h3 id="sh-t">${esc(p.text)}</h3>
        ${p.due?`<div class="field"><span class="k">Resolve by</span><span class="due">${when(p.due,d.timing.arrivalAt)}</span></div>`:""}
        <div class="field"><span class="k">${isDose(p)?"The two sources disagree":"Where this comes from"}</span>${ev}</div>
        ${p.ask?`<div class="field"><span class="k">Ask the hospital</span><div class="ask">${esc(p.ask)}</div></div>`:""}
      </div>
      <div class="sheet-foot">
        <button class="btn primary" id="resolve">${done?"Mark as open":"Mark as resolved"}</button>
        <button class="btn" data-close>Close</button>
      </div>
    </aside>`;
  document.body.classList.add("sheet-open");
  layer.querySelector(".x").focus();
  document.getElementById("resolve").onclick=()=>{
    done?state.resolved.delete(k):state.resolved.add(k);
    closeSheet(); render(); toast(done?"Marked as open":"Marked as resolved");
  };
}
function closeSheet(){ layer.innerHTML=""; document.body.classList.remove("sheet-open"); }
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),1600); }

/* ---------- guided walkthrough ---------- */
const TOUR = [
  {text:"Two referral packets came in tonight. Each one is about 60 pages.", act:()=>go("inbox"), btn:"Open Elena"},
  {text:"Same patient, three answers. Bayview can take her tonight; Harborview needs paperwork first; Maple Grove can't manage her insulin overnight.", act:()=>go("case",{c:"elena"}), btn:"Open Harborview"},
  {text:"Nothing in the packet mentions PASRR. The screen calls that out instead of assuming it's fine.", act:()=>{go("fac",{c:"elena",f:"B"}); const i=DATA.elena.fac.B.priorities.findIndex(p=>p.ids.includes("REG-01")); openSheet(i);}, btn:"Next: Harold"},
  {text:"Harold's paperwork is complete, but the discharge list and the cardiology note disagree on his torsemide dose.", act:()=>{go("fac",{c:"harold",f:"B"}); const i=DATA.harold.fac.B.priorities.findIndex(isDose); openSheet(i);}, btn:"See the call sheet"},
  {text:"Every open item becomes one question for the hospital. One call covers all three facilities.", act:()=>go("calls",{c:"harold"}), btn:"Finish"}
];
function renderGuide(){
  const g=document.getElementById("guide");
  document.body.classList.toggle("guide-on", !state.guideOff);
  if(state.guideOff){ g.hidden=true; return; }
  const s=TOUR[state.guide];
  g.hidden=false;
  g.innerHTML=`<p><span class="step">Walkthrough ${state.guide+1} of ${TOUR.length}</span>${s.text}</p>
    <button class="skip" id="g-skip">Hide</button><button id="g-next">${s.btn}</button>`;
  document.getElementById("g-next").onclick=()=>{
    if(state.guide===TOUR.length-1){ state.guideOff=true; renderGuide(); return; }
    state.guide++; TOUR[state.guide].act(); renderGuide();
  };
  document.getElementById("g-skip").onclick=()=>{ state.guideOff=true; renderGuide(); };
}

/* ---------- routing ---------- */
function go(screen, o={}){ closeSheet(); Object.assign(state,{screen},o); render(); window.scrollTo(0,0); }
function render(){
  app.innerHTML = {inbox, case:caseScreen, fac:facScreen, calls:callsScreen}[state.screen]();
}
app.addEventListener("click", e=>{
  const t=e.target.closest("[data-go],[data-open]"); if(!t) return;
  if(t.dataset.open!==undefined) return openSheet(+t.dataset.open);
  go(t.dataset.go, {c:t.dataset.c??state.c, f:t.dataset.f??state.f});
});
app.addEventListener("change", e=>{
  const cb=e.target.closest("input[data-ask]"); if(!cb) return;
  const k=state.c+cb.dataset.ask; cb.checked?state.asked.add(k):state.asked.delete(k);
  cb.closest(".q").classList.toggle("checked",cb.checked);
  const all=app.querySelectorAll("input[data-ask]"), n=[...all].filter(x=>x.checked).length;
  document.getElementById("prog").textContent=`${n} of ${all.length} answered`;
});
app.addEventListener("click", e=>{
  if(e.target.id!=="copy") return;
  const text=[...app.querySelectorAll("input[data-ask]")].map((x,i)=>`${i+1}. ${x.dataset.ask}`).join("\n");
  navigator.clipboard?.writeText(text).then(()=>toast("Questions copied"),()=>toast("Copy isn't available here"));
});
layer.addEventListener("click", e=>{ if(e.target.closest("[data-close]")) closeSheet(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });
document.getElementById("home").onclick=()=>go("inbox");

render(); renderGuide();
</script>
